---
Name: 'asset-icons-renderable-previews'
After:
  - '#asset-icons'
  # asset-admin 2 (Silverstripe 5) defines the .graphql service in this fragment
  - '#asset-admin-graphql-thumbnails'
  # asset-admin 3 (Silverstripe 6) defines the .assetadminopen service in this fragment
  - '#assetadminthumbnails'
---
# Renderable preview support — generates PNG previews for PDFs, SVGs, etc.
# Disabled by default. Enable in your project config:
#
#   Restruct\SilverStripe\AssetIcons\Renderable\RenderablePreviewExtension:
#     enable_renderable_previews: true
#
SilverStripe\Assets\File:
  extensions:
    RenderablePreview: Restruct\SilverStripe\AssetIcons\Renderable\RenderablePreviewExtension

# Override the GraphQL-specific ThumbnailGenerator so rendered previews
# appear as the `thumbnail` field for non-image files.
# Only targets the asset admin's named services (.graphql and .assetadminopen,
# see below) - no side effects on UploadField or other ThumbnailGenerator
# consumers.
#
# Silverstripe 6 (asset-admin 3) dropped GraphQL: the asset admin reads its
# file list from AssetAdminOpen, which uses the `.assetadminopen` service
# instead. Overriding only `.graphql` there is silent - no error, the previews
# just never appear - so both are overridden. Each major ignores the service
# name it does not use. Both keep `Generates: false` like core's own
# definitions, so opening the asset admin never generates image thumbnails.
# Today those two lines are redundant: the Injector merges core's own
# `Generates: false` into these definitions, and the tests cannot tell whether
# ours are present. They are kept on purpose, so the asset admin keeps not
# generating thumbnails even if core ever changes its default.
SilverStripe\Core\Injector\Injector:
  SilverStripe\AssetAdmin\Model\ThumbnailGenerator.graphql:
    class: Restruct\SilverStripe\AssetIcons\Renderable\RenderableThumbnailGenerator
    properties:
      Generates: false
  SilverStripe\AssetAdmin\Model\ThumbnailGenerator.assetadminopen:
    class: Restruct\SilverStripe\AssetIcons\Renderable\RenderableThumbnailGenerator
    properties:
      Generates: false
